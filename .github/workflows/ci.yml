
name: FailNet CI

on:
  push:
    branches: [main, Ivan]
  pull_request:
    branches: [main, Ivan]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django / Python 3.13
    runs-on: ubuntu-latest

    env:
      # Configuración ficticia para CI. No conecta con Atlas real.
      DJANGO_SECRET_KEY: ci-only-not-for-production-please-change
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      MONGODB_HOST: "mongodb+srv://ci.example.com"
      MONGODB_USER: ci
      MONGODB_PASSWORD: ci
      MONGODB_DB_NAME: failnet_ci

    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Configurar Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ==================================================
      # Calidad de código con Ruff
      # ==================================================

      - name: Instalar Ruff
        run: python -m pip install ruff

      - name: Analizar calidad de código Python
        run: ruff check . --output-format=github

      - name: Verificar formato Python
        run: ruff format --check .

      # ==================================================
      # Validaciones de Django
      # ==================================================

      - name: Verificar sintaxis de Python
        run: python -m compileall -q dashboard failnet_web src

      - name: Verificar configuración de Django
        env:
          DJANGO_SECRET_KEY: ci-only-not-for-production
          DJANGO_DEBUG: 'False'
          DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
          DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5173
          MONGODB_HOST: 'mongodb+srv://ci.example.com'
          MONGODB_USER: ci
          MONGODB_PASSWORD: ci
          MONGODB_DB_NAME: failnet_ci
        run: |
          python -c "import os; h=os.getenv('MONGODB_HOST', ''); print('MONGODB_HOST configurado:', bool(h)); print('Formato valido:', h.startswith('mongodb+srv://'))"
          python manage.py check

      # No se ejecutan pruebas contra MongoDB Atlas real.
      # Los modelos .joblib tampoco están incluidos en Git.

  frontend:
    name: React / Vite / pnpm
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Configurar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias desde lockfile
        run: pnpm install --frozen-lockfile

      - name: Compilar frontend
        run: pnpm build
