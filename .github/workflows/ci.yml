name: FailNet CI

on:
  push:
    branches: [main, Ivan]
  pull_request:
    branches: [main, Ivan]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django / Python 3.13
    runs-on: ubuntu-latest
    env:
      # Valores locales ficticios: el job NO debe conectarse al Atlas real.
      DJANGO_SECRET_KEY: ci-only-not-for-production-please-change
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      MONGODB_HOST: "mongodb+srv://ci.example.com"
      MONGODB_USER: ci
      MONGODB_PASSWORD: ci
      MONGODB_DB_NAME: failnet_ci

    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Configurar Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar sintaxis de Python
        run: python -m compileall -q dashboard failnet_web src

      - name: Verificar configuración de Django (sin conexión a Atlas)
        run: python manage.py check

      # Los tests que utilicen MongoDB Atlas o modelos .joblib requieren
      # mocks/fixtures específicos. No se ejecutan contra producción.

  frontend:
    name: React / Vite / pnpm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          # Ajusta a la versión principal de pnpm usada en tu equipo.
          version: 10

      - name: Configurar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias desde lockfile
        run: pnpm install --frozen-lockfile

      - name: Compilar frontend
        run: pnpm build
